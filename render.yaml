# Render Blueprint: New -> Blueprint -> pick this repo.
# Activations are stored in Postgres (e.g. Neon) via DATABASE_URL, so no disk is needed.
# In the dashboard, set DATABASE_URL and add the Secret File "trove_private_key.pem" (see README.md).
services:
  - type: web
    name: trove-activation
    runtime: docker
    plan: starter            # "free" also works with Neon, but sleeps when idle (first activation ~30-60 s)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string in the dashboard (never commit it)
      - key: TROVE_PRIVATE_KEY_PATH
        value: /etc/secrets/trove_private_key.pem
